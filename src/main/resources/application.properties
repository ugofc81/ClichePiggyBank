spring.application.name=ClichePiggyBank
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/clichepiggybank}
spring.datasource.username=${DATABASE_USER:piggybank}
spring.datasource.password=${DATABASE_PASSWORD:piggybank}
spring.sql.init.mode=always
legacy-data.user-file=${LEGACY_USERS_FILE:users.json}
legacy-data.account-file=${LEGACY_ACCOUNTS_FILE:accounts.json}
legacy-data.sanction-file=${LEGACY_SANCTIONS_FILE:sanctions.json}
server.port=9092